[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-econometrics-lab"
version = "0.1.0"
description = "Interactive spatial econometrics and GIS analysis platform (GeoPandas, PySAL, Folium, Streamlit)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "shapely>=2.0",
    "pyproj>=3.5",
    "pyogrio>=0.7",
    "geopandas>=0.14",
    "libpysal>=4.9",
    "esda>=2.5",
    "spreg>=1.4",
    "folium>=0.15",
    "streamlit>=1.30",
    "streamlit-folium>=0.18",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "black>=24.0", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
